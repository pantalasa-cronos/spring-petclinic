name: CI
# Trimmed for lunar-lib ENG-1981 test-results evidence: one job per push. Do not merge.
on:
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: cronos
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Gradle test
        run: ./gradlew test --no-daemon || true
