name: CI
# Trimmed for lunar-lib ENG-1981 evidence: integration (Maven) fails one test,
# then unit (Gradle) passes and finishes last. Do not merge.
on:
  pull_request:
    branches: ["**"]

jobs:
  integration:
    runs-on: cronos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Maven tests
        run: ./mvnw -B test -Dtest='!PostgresIntegrationTests,!MySqlIntegrationTests' || true
  unit:
    needs: integration
    runs-on: cronos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Gradle tests
        run: ./gradlew test --no-daemon || true
